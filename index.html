<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>X Clone</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <!-- Auth Screen -->
    <div id="auth-screen" class="screen">
      <div class="auth-container">
        <h1 class="logo">𝕏</h1>
        <div id="login-form">
          <h2>ログイン</h2>
          <input id="login-email" type="email" placeholder="メールアドレス" />
          <input id="login-password" type="password" placeholder="パスワード" />
          <button id="login-btn">ログイン</button>
          <p class="switch-link">アカウントがない？ <a href="#" id="go-register">登録する</a></p>
        </div>
        <div id="register-form" style="display:none">
          <h2>アカウント作成</h2>
          <input id="reg-email" type="email" placeholder="メールアドレス" />
          <input id="reg-password" type="password" placeholder="パスワード（6文字以上）" />
          <button id="register-btn">登録</button>
          <p class="switch-link">すでにアカウントがある？ <a href="#" id="go-login">ログイン</a></p>
        </div>
        <div id="auth-message" class="message"></div>
      </div>
    </div>

    <!-- Main Screen -->
    <div id="main-screen" class="screen" style="display:none">
      <header>
        <span class="logo-small">𝕏</span>
        <span id="user-email-display"></span>
        <button id="logout-btn">ログアウト</button>
      </header>
      <main>
        <div class="tweet-box">
          <textarea id="tweet-input" placeholder="いまどうしてる？" maxlength="280"></textarea>
          <div class="tweet-box-footer">
            <span id="char-count">280</span>
            <button id="tweet-btn">ポスト</button>
          </div>
        </div>
        <div id="tweet-list"></div>
      </main>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js"></script>
</body>
</html>
